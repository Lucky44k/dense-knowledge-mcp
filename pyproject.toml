[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "model-module-protocol"
version = "1.0.0"
description = "Portable, append-only research memory for language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucky44k" }]
dependencies = []
keywords = ["llm", "mcp", "knowledge-management", "retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Lucky44k/Dense-Knowledge"
Repository = "https://github.com/Lucky44k/Dense-Knowledge"
Issues = "https://github.com/Lucky44k/Dense-Knowledge/issues"

[project.optional-dependencies]
language = ["langid>=1.1.6"]
mcp = ["mcp>=1.2.0,<2", "langid>=1.1.6"]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.11"]

[project.scripts]
mmp = "mmp.cli:main"
mmp-server = "mmp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
